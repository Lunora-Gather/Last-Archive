name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build both targets
        run: dotnet build -c Release
      - name: Run core tests
        run: dotnet bin/Release/net10.0/LastArchive.dll --test
      - name: Install WebKit for browser tests
        run: |
          npm install --prefix "$RUNNER_TEMP/last-archive-test" --no-save playwright@1.65.1
          "$RUNNER_TEMP/last-archive-test/node_modules/.bin/playwright" install --with-deps webkit
      - name: Run browser tests
        run: NODE_PATH="$RUNNER_TEMP/last-archive-test/node_modules" node tests/web-flow.cjs
